name: C3 E2E
on:
  merge_group:
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  # Match the test/check workflow's opt-in benchmarks, including nested builds.
  TURBO_CACHE: ${{ contains(github.event.pull_request.labels.*.name, 'ci:no-turbo-cache') && 'local:,remote:' || 'local:rw,remote:rw' }}
  TURBO_RUN_SUMMARY: "true"

jobs:
  e2e:
    # Runs the non-frameworks C3 E2E tests on all supported operating systems
    # and package managers.
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os.name }}-${{ matrix.pm.name }}-${{ matrix.pm.version }}${{ matrix.experimental && '-experimental' || '' }}-${{ matrix.filter }}
      cancel-in-progress: ${{ github.head_ref != 'changeset-release/main' }}
    name: ${{ format('C3 E2E ({0}, {1}{2}) - {3}', matrix.pm.name, matrix.os.description, matrix.experimental && ', experimental' || '', matrix.filter) }}
    strategy:
      fail-fast: false
      matrix:
        experimental: [false]
        filter: ["cli", "workers"]
        os: [{ name: ubuntu-latest, description: Linux }]
        pm:
          - { name: pnpm, version: "12.9.1" }
          - { name: npm, version: "11.7.0" }
          # The yarn tests keep failing on Linux with out of space errors, with no clear reason why. Disabling for now.
          # - { name: yarn, version: "1.0.0" }
        include:
          - os: { name: windows-latest, description: Windows }
            pm: { name: pnpm, version: "12.9.1" }
            filter: "cli"
          - os: { name: windows-latest, description: Windows }
            pm: { name: pnpm, version: "12.9.1" }
            filter: "workers"
          - os: { name: ubuntu-latest, description: Linux }
            pm: { name: pnpm, version: "12.9.1" }
            experimental: true
            filter: "cli"
          - os: { name: ubuntu-latest, description: Linux }
            pm: { name: pnpm, version: "12.9.1" }
            experimental: true
            filter: "workers"
    runs-on: ${{ matrix.os.name }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          filters: |
            everything_but_markdown:
              - '!**/*.md'

      - name: Install Dependencies
        if: steps.changes.outputs.everything_but_markdown == 'true'
        uses: ./.github/actions/install-dependencies
        with:
          turbo-api: ${{ secrets.TURBO_API }}
          turbo-team: ${{ secrets.TURBO_TEAM }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-signature: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

      - name: Install Python uv
        if: steps.changes.outputs.everything_but_markdown == 'true'
        uses: ./.github/actions/install-python-uv

      # Needed because gatsby requires git
      - name: Configure Git
        shell: bash
        run: |
          git config --global user.email wrangler@cloudflare.com
          git config --global user.name 'Wrangler Tester'

      - name: Install matrix npm version for scaffolded installs
        if: matrix.pm.name == 'npm' && steps.changes.outputs.everything_but_markdown == 'true'
        shell: bash
        run: |
          npm install --global npm@${{ matrix.pm.version }}
          got="$(npm --version)"
          want="${{ matrix.pm.version }}"
          echo "npm on PATH: $got (expected $want)"
          [ "$got" = "$want" ] || { echo "ERROR: PATH npm is $got, not $want."; exit 1; }

      - id: run-e2e
        if: steps.changes.outputs.everything_but_markdown == 'true'
        shell: bash
        run: pnpm run test:ci:logged .turbo/ci-logs/c3.log run test:e2e:c3
        env:
          NODE_VERSION: ${{ env.NODE_VERSION }}
          E2E_EXPERIMENTAL: ${{ matrix.experimental }}
          E2E_TEST_PM: ${{ matrix.pm.name }}
          E2E_TEST_PM_VERSION: ${{ matrix.pm.version }}
          E2E_TEST_FILTER: ${{ matrix.filter }}
          CI_OS: ${{ runner.os }}
          GITHUB_TOKEN: ${{ github.token }} # Needed for begit to clone the repo in the e2e tests for solid-start

      - name: Report test retries
        if: ${{ !cancelled() && steps.changes.outputs.everything_but_markdown == 'true' }}
        run: node -r esbuild-register tools/test/report-test-retries.ts

      - name: Upload Logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.changes.outputs.everything_but_markdown == 'true' }}
        with:
          name: ${{ format('e2e-logs-{0}-{1}-{2}-{3}', matrix.pm.name, matrix.os.description, matrix.experimental && 'experimental' || 'normal', matrix.filter) }}
          path: packages/create-cloudflare/.e2e-logs${{ matrix.experimental && '-experimental' || '' }}/${{ matrix.pm.name }}
          include-hidden-files: true

      - name: Upload Turbo Summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.changes.outputs.everything_but_markdown == 'true' }}
        with:
          name: ${{ format('turbo-runs-{0}-{1}-{2}-{3}', matrix.pm.name, matrix.os.description, matrix.experimental && 'experimental' || 'normal', matrix.filter) }}
          path: |
            .turbo/runs
            .turbo/test-retries.json
            .turbo/ci-logs
          include-hidden-files: true

  frameworks-e2e-shards:
    # Runs the C3 frameworks E2E tests only in the merge queue, on the release branch, if create-cloudflare has changed, or when explicitly requested via label.
    # Case shards retain the five concurrent tests per runner used by Vitest.
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-frameworks${{ matrix.experimental && '-experimental' || '' }}-${{ github.ref }}-${{ matrix.os.name }}-${{ matrix.pm.name }}-${{ matrix.pm.version }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.head_ref != 'changeset-release/main' }}
    name: ${{ format('C3 E2E ({0}, {1}{2}) - frameworks {3}/{4}', matrix.pm.name, matrix.os.description, matrix.experimental && ', experimental' || '', matrix.shard, matrix.shards) }}
    strategy:
      fail-fast: false
      matrix:
        experimental: [false]
        shard: [1, 2, 3]
        shards: [3]
        os:
          - { name: ubuntu-latest, description: Linux }
        pm:
          - { name: pnpm, version: "12.9.1" }
          - { name: npm, version: "11.7.0" }
        include:
          # The smaller experimental suite uses two shards on the default pnpm.
          - os: { name: ubuntu-latest, description: Linux }
            pm: { name: pnpm, version: "12.9.1" }
            experimental: true
            shard: 1
            shards: 2
          - os: { name: ubuntu-latest, description: Linux }
            pm: { name: pnpm, version: "12.9.1" }
            experimental: true
            shard: 2
            shards: 2
    runs-on: ${{ matrix.os.name }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          filters: |
            everything_but_markdown:
              - '!**/*.md'
            framework_deps:
              - 'packages/create-cloudflare/**'

      - name: Check if frameworks tests should run
        id: check-frameworks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          FRAMEWORK_DEPS_CHANGED: ${{ steps.changes.outputs.framework_deps }}
        run: |
          if [ "$EVENT_NAME" = "merge_group" ] || \
             [ "$HEAD_REF" = "changeset-release/main" ] || \
             [ "$FRAMEWORK_DEPS_CHANGED" = "true" ]; then
            echo "run_frameworks=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            HAS_LABEL=$(gh pr view "$PR_NUMBER" \
              --repo "$REPO" --json labels \
              --jq '[.labels[].name] | any(. == "run-c3-frameworks-tests")')
            echo "run_frameworks=${HAS_LABEL}" >> "$GITHUB_OUTPUT"
          else
            echo "run_frameworks=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies
        if: steps.check-frameworks.outputs.run_frameworks == 'true' && steps.changes.outputs.everything_but_markdown == 'true'
        uses: ./.github/actions/install-dependencies
        with:
          turbo-api: ${{ secrets.TURBO_API }}
          turbo-team: ${{ secrets.TURBO_TEAM }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-signature: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

      - name: Install Python uv
        if: steps.check-frameworks.outputs.run_frameworks == 'true' && steps.changes.outputs.everything_but_markdown == 'true'
        uses: ./.github/actions/install-python-uv

      - name: Configure Git
        if: steps.check-frameworks.outputs.run_frameworks == 'true' && steps.changes.outputs.everything_but_markdown == 'true'
        shell: bash
        run: |
          git config --global user.email wrangler@cloudflare.com
          git config --global user.name 'Wrangler Tester'

      - name: Install matrix npm version for scaffolded installs
        if: matrix.pm.name == 'npm' && steps.check-frameworks.outputs.run_frameworks == 'true' && steps.changes.outputs.everything_but_markdown == 'true'
        shell: bash
        run: |
          npm install --global npm@${{ matrix.pm.version }}
          got="$(npm --version)"
          want="${{ matrix.pm.version }}"
          echo "npm on PATH: $got (expected $want)"
          [ "$got" = "$want" ] || { echo "ERROR: PATH npm is $got, not $want."; exit 1; }

      - id: run-e2e
        if: steps.check-frameworks.outputs.run_frameworks == 'true' && steps.changes.outputs.everything_but_markdown == 'true'
        shell: bash
        run: pnpm run test:ci:logged .turbo/ci-logs/c3.log run test:e2e:c3
        env:
          NODE_VERSION: ${{ env.NODE_VERSION }}
          # Some framework generators write a different pnpm version to `packageManager`.
          # By default pnpm downloads and runs it. Concurrent tests can then provision
          # that version in the same pnpm tool store, causing recursive installs.
          pnpm_config_manage_package_manager_versions: "false"
          E2E_EXPERIMENTAL: ${{ matrix.experimental }}
          E2E_TEST_PM: ${{ matrix.pm.name }}
          E2E_TEST_PM_VERSION: ${{ matrix.pm.version }}
          E2E_TEST_FILTER: frameworks
          E2E_FRAMEWORK_SHARD: ${{ format('{0}/{1}', matrix.shard, matrix.shards) }}
          CI_OS: ${{ runner.os }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Report test retries
        if: ${{ !cancelled() && steps.check-frameworks.outputs.run_frameworks == 'true' && steps.changes.outputs.everything_but_markdown == 'true' }}
        run: node -r esbuild-register tools/test/report-test-retries.ts

      - name: Upload Logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.check-frameworks.outputs.run_frameworks == 'true' && steps.changes.outputs.everything_but_markdown == 'true' }}
        with:
          name: ${{ format('e2e-logs-{0}-{1}-{2}-frameworks-{3}', matrix.pm.name, matrix.os.description, matrix.experimental && 'experimental' || 'normal', matrix.shard) }}
          path: packages/create-cloudflare/.e2e-logs${{ matrix.experimental && '-experimental' || '' }}/${{ matrix.pm.name }}
          include-hidden-files: true

      - name: Upload Turbo Summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.check-frameworks.outputs.run_frameworks == 'true' && steps.changes.outputs.everything_but_markdown == 'true' }}
        with:
          name: ${{ format('turbo-runs-{0}-{1}-{2}-frameworks-{3}', matrix.pm.name, matrix.os.description, matrix.experimental && 'experimental' || 'normal', matrix.shard) }}
          path: |
            .turbo/runs
            .turbo/test-retries.json
            .turbo/ci-logs
          include-hidden-files: true

  # Preserve required check names and require every framework shard to succeed.
  frameworks-e2e:
    needs: frameworks-e2e-shards
    if: always()
    timeout-minutes: 5
    name: ${{ format('C3 E2E ({0}, Linux{1}) - frameworks', matrix.pm, matrix.experimental && ', experimental' || '') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        experimental: [false]
        pm: [pnpm, npm]
        include:
          - pm: pnpm
            experimental: true
    steps:
      - name: Require all framework shards to pass
        env:
          FRAMEWORK_RESULT: ${{ needs.frameworks-e2e-shards.result }}
        run: |
          if [ "$FRAMEWORK_RESULT" != "success" ]; then
            echo "Framework shards did not all pass: $FRAMEWORK_RESULT"
            exit 1
          fi
