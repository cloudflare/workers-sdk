name: Vite plugin v1 E2E

on:
  pull_request:
    branches: [vite-plugin-v1]
  push:
    branches: [vite-plugin-v1]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  test:
    name: Vite Plugin E2E (${{ matrix.description }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            description: Linux
          - os: macos-latest
            description: macOS
          - os: windows-latest
            description: Windows
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-dependencies
      - uses: ./.github/actions/check-remote-tests
        id: remote
      - run: pnpm test:e2e
        env:
          NODE_DEBUG: vite-plugin:test
          CLOUDFLARE_API_TOKEN: ${{ steps.remote.outputs.run-remote == 'true' && secrets.TEST_CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.remote.outputs.run-remote == 'true' && secrets.TEST_CLOUDFLARE_ACCOUNT_ID || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-logs-${{ matrix.os }}
          path: .turbo/runs
