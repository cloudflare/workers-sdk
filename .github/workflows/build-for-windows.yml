name: Build for Windows tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build packages for Windows tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-windows-build
      cancel-in-progress: ${{ github.head_ref != 'changeset-release/main' }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies
        with:
          turbo-api: ${{ secrets.TURBO_API }}
          turbo-team: ${{ secrets.TURBO_TEAM }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-signature: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

      # tsrs has no Windows binary. Only build tasks enter this cache; the
      # consuming runners execute their tests on Windows against these outputs.
      - name: Build packages
        run: pnpm build
        env:
          CI_OS: Windows
          TURBO_CACHE: "local:rw,remote:"

      - name: Upload build cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build-cache
          path: .turbo/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
