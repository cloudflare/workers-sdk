name: Release Vite plugin v1

on:
  push:
    branches: [vite-plugin-v1]

permissions:
  contents: read
  id-token: write

concurrency:
  group: vite-plugin-v1-release
  cancel-in-progress: false

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  release:
    if: github.repository_owner == 'cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: ./.github/actions/install-dependencies
        with:
          node-version: 24.18.0
          disable-cache: "true"
      - run: node -r esbuild-register tools/deployments/check-npm-version.ts
      - run: pnpm check:changesets
      - run: pnpm build
        env:
          SOURCEMAPS: "false"
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          title: "[vite-plugin] Version v1 maintenance release"
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
