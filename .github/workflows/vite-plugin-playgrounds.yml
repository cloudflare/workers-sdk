name: Vite plugin v1 playgrounds

on:
  pull_request:
    branches: [vite-plugin-v1]
  push:
    branches: [vite-plugin-v1]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  test:
    name: Vite Plugin Playground (${{ matrix.os }}, vite-${{ matrix.vite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vite: [8]
        include:
          - os: ubuntu-latest
            vite: 6
          - os: ubuntu-latest
            vite: 7
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-dependencies
        with:
          turbo-api: ${{ secrets.TURBO_API }}
          turbo-team: ${{ secrets.TURBO_TEAM }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-signature: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      - run: pnpm build
      # --only avoids rebuilding the plugin after selecting Vite 6 or 7, but
      # also removes its dependency hashes from the test cache key. Capture the
      # actual build hash before the downgrade to restore that invalidation.
      - name: Export plugin build hash for the playground cache key
        shell: bash
        run: |
          pnpm dotenv -- turbo build --filter @cloudflare/vite-plugin --dry=json |
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const { tasks } = JSON.parse(readFileSync(0, "utf8"));
              const task = tasks.find((t) => t.taskId === "@cloudflare/vite-plugin#build");
              if (!task) {
                throw new Error("No @cloudflare/vite-plugin#build task in the turbo summary");
              }
              console.log(`VITE_PLUGIN_BUILD_HASH=${task.hash}`);
            ' >> "$GITHUB_ENV"
      - name: Select compatibility Vite version
        if: matrix.vite != 8
        env:
          VITE_MAJOR: ${{ matrix.vite }}
        shell: bash
        run: pnpm update -r --no-save "vite@^${VITE_MAJOR}.0.0"
      - run: pnpm --filter @vite-plugin-cloudflare/playground playwright:install
      - run: pnpm dotenv -- turbo test:ci:serve --filter @vite-plugin-cloudflare/playground --only --summarize
        env:
          VITE_VERSION: vite-${{ matrix.vite }}
          NODE_OPTIONS: --max_old_space_size=8192
          NODE_DEBUG: "@cloudflare:vite-plugin"
      - run: pnpm dotenv -- turbo test:ci:build --filter @vite-plugin-cloudflare/playground --only --summarize
        env:
          VITE_VERSION: vite-${{ matrix.vite }}
          NODE_OPTIONS: --max_old_space_size=8192
          NODE_DEBUG: "@cloudflare:vite-plugin"
