name: Vite plugin v1 playgrounds

on:
  pull_request:
    branches: [vite-plugin-v1]
  push:
    branches: [vite-plugin-v1]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  test:
    name: Playgrounds (${{ matrix.os }}, Vite ${{ matrix.vite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vite: [8]
        include:
          - os: ubuntu-latest
            vite: 6
          - os: ubuntu-latest
            vite: 7
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-dependencies
      - run: pnpm build
      - name: Select compatibility Vite version
        if: matrix.vite != 8
        env:
          VITE_MAJOR: ${{ matrix.vite }}
        shell: bash
        run: pnpm --config.allow-unused-patches=true update -r --no-save "vite@^${VITE_MAJOR}.0.0"
      - run: pnpm --filter @vite-plugin-cloudflare/playground playwright:install
      - run: pnpm --filter @vite-plugin-cloudflare/playground test:ci:serve
        env:
          VITE_VERSION: vite-${{ matrix.vite }}
          NODE_OPTIONS: --max_old_space_size=8192
      - run: pnpm --filter @vite-plugin-cloudflare/playground test:ci:build
        env:
          VITE_VERSION: vite-${{ matrix.vite }}
          NODE_OPTIONS: --max_old_space_size=8192
