name: Vouch

on:
  # Only check new PRs so maintainers can reopen one after triage.
  pull_request_target: # zizmor: ignore[dangerous-triggers] reads trusted default-branch files and PR metadata without checking out or executing PR code
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    if: ${{ github.repository_owner == 'cloudflare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Use the current policy even for PRs targeting older branches.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check pull request author
        run: node .github/scripts/vouch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
