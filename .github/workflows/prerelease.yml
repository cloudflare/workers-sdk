name: Vite plugin v1 preview package

on:
  pull_request:
    branches: [vite-plugin-v1]
  push:
    branches: [vite-plugin-v1]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  build:
    if: github.repository_owner == 'cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-dependencies
        with:
          disable-cache: "true"
      - run: pnpm build
        env:
          SOURCEMAPS: "false"
      - run: node .github/prereleases/upload.mjs
