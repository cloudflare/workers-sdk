name: Vite plugin v1 CI

on:
  pull_request:
    branches: [vite-plugin-v1]
  push:
    branches: [vite-plugin-v1]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.head_ref, 'changeset-release/') }}

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-dependencies
      - run: pnpm check
        env:
          NODE_OPTIONS: --max_old_space_size=8192
  test:
    name: Unit and fixture tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-dependencies
      - run: pnpm build
      - run: pnpm test:ci
      - run: pnpm --filter @fixture/create-test-harness-example playwright:install
      - run: pnpm test:fixtures
