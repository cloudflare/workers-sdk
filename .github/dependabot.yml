version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: vite-plugin-v1
    schedule:
      interval: weekly
      day: sunday
      time: "06:00"
    cooldown:
      default-days: 1
      exclude: ["@cloudflare/*", "miniflare", "workerd", "wrangler"]
    commit-message:
      prefix: "[vite-plugin]"
    labels: [package:vite-plugin, dependencies]
    groups:
      workers-sdk:
        patterns: ["@cloudflare/*", "wrangler", "miniflare", "workerd"]
