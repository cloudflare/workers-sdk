packages:
  - packages/*
  - packages/vite-plugin-cloudflare/playground
  - packages/vite-plugin-cloudflare/playground/*
  - fixtures/*
gitChecks: false
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@cloudflare/*"
  # Wrangler is also first-party and must be usable on its release day.
  - wrangler
  - miniflare
  - workerd
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  playwright-chromium: true
  prisma: true
  protobufjs: false
  msw: false
  "@sentry/cli": true
overrides:
  "@types/node": $@types/node
  "@types/node>undici-types": catalog:default
  # @aws-sdk/core pins 4.4.1 in the retained S3 playground dependencies.
  "@aws-sdk/core@3>fast-xml-parser": "^4.5.5"
  # Verdaccio pins 4.17.21 in the retained mock npm registry.
  "lodash@<4.18.1": "^4.18.1"
peerDependencyRules:
  allowedVersions:
    # Retained Remix playground dependencies still declare TypeScript 5 ranges.
    "unbuild>typescript": "6"
    "@remix-run/cloudflare>typescript": "6"
    "@remix-run/server-runtime>typescript": "6"
patchedDependencies:
  # Remove the unused name-preservation helper import from declaration output.
  # See https://github.com/sxzz/rolldown-plugin-dts/issues/369
  "rolldown-plugin-dts@0.27.14": "patches/rolldown-plugin-dts@0.27.14.patch"
  toucan-js@4.0.0: patches/toucan-js@4.0.0.patch
  youch@4.1.0-beta.10: patches/youch@4.1.0-beta.10.patch
  buffer-equal-constant-time@1.0.1: patches/buffer-equal-constant-time@1.0.1.patch
catalog:
  tsdown: "0.22.14"
  "@types/node": 22.15.17
  typescript: 6.0.3
  undici: 7.30.2
  undici-types: 7.30.2
  vitest: 5.0.4
  vite: 8.3.4
  esbuild: 0.28.2
  "@playwright/test": 1.61.0
  playwright-chromium: 1.61.0
  "@cloudflare/workers-types": 5.20261123.1
  jsonc-parser: 3.2.0
  msw: 2.14.6
  tree-kill: 1.2.2
  chalk: 5.3.0
  ws: 8.21.0
  capnweb: 0.12.0
  "@cloudflare/vitest-plugin": 1.4.3
  zod: 4.6.6
