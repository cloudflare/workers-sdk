packages:
  - packages/*
  - packages/vite-plugin-cloudflare/playground
  - packages/vite-plugin-cloudflare/playground/*
  - fixtures/*
gitChecks: false
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@cloudflare/*"
  # Wrangler is also first-party and must be usable on its release day.
  - wrangler
  - miniflare
  - workerd
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  playwright-chromium: true
  prisma: true
  protobufjs: false
  msw: false
  "@sentry/cli": true
overrides:
  "@types/node": $@types/node
  "@types/node>undici-types": catalog:default
patchedDependencies:
  toucan-js@4.0.0: patches/toucan-js@4.0.0.patch
  youch@4.1.0-beta.10: patches/youch@4.1.0-beta.10.patch
  buffer-equal-constant-time@1.0.1: patches/buffer-equal-constant-time@1.0.1.patch
catalog:
  "@types/node": 22.15.17
  typescript: 5.8.3
  undici: 7.30.1
  undici-types: 7.30.1
  vitest: 5.0.4
  vite: 8.3.4
  esbuild: 0.28.2
  "@playwright/test": 1.60.0
  playwright-chromium: 1.60.0
  "@cloudflare/workers-types": 5.20261023.1
  jsonc-parser: 3.2.0
  msw: 2.14.6
  tree-kill: 1.2.2
  chalk: 5.3.0
  ws: 8.21.0
  capnweb: 0.12.0
  "@cloudflare/vitest-plugin": 1.4.3
  zod: 4.6.6
