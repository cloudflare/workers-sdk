packages:
  - packages/*
  - packages/vite-plugin-cloudflare/playground
  - packages/vite-plugin-cloudflare/playground/*
  - fixtures/*
gitChecks: false
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@cloudflare/*"
  - cf
  - miniflare
  - workerd
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  playwright-chromium: true
  prisma: true
  protobufjs: false
  msw: false
  "@sentry/cli": true
overrides:
  "@types/node": $@types/node
  "@types/node>undici-types": catalog:default
patchedDependencies:
  toucan-js@4.0.0: patches/toucan-js@4.0.0.patch
  youch@4.1.0-beta.10: patches/youch@4.1.0-beta.10.patch
  buffer-equal-constant-time@1.0.1: patches/buffer-equal-constant-time@1.0.1.patch
  vite@8.1.5: patches/vite@8.1.5.patch
catalog:
  cf: 1.0.0-beta.2
  "@types/node": 22.15.17
  typescript: 5.8.3
  undici: 7.29.1
  undici-types: 7.29.1
  vitest: 4.1.0
  vite: 8.1.5
  esbuild: 0.28.2
  "@playwright/test": 1.60.0
  playwright-chromium: 1.60.0
  "@cloudflare/workers-types": 5.20261015.1
  jsonc-parser: 3.2.0
  msw: 2.14.6
  tree-kill: 1.2.2
  chalk: 5.3.0
  ws: 8.21.0
  capnweb: 0.12.0
  "@cloudflare/vitest-pool-workers": 0.13.3
  zod: 4.6.5
